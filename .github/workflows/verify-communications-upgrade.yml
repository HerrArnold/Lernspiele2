name: Verify real mailbox, achievements and Baobab timeline
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'cloudflare-integration.js'
      - 'lernsafari-extras.js'
      - 'cloudflare-worker/communications-*'
      - 'baobab-projects.js'
      - 'tests/cloudflare-mailbox-upgrade.test.mjs'
      - '.github/workflows/verify-communications-upgrade.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check app.js
          node --check cloudflare-integration.js
          node --check lernsafari-extras.js
          node --check baobab-projects.js
          node --check cloudflare-worker/communications-service.mjs
          node --check cloudflare-worker/communications-d1-store.mjs
          node --test tests/cloudflare-communications.test.mjs tests/cloudflare-mailbox-upgrade.test.mjs tests/cloudflare-projects.test.mjs
