name: Verify LernSafari2 main (website)
on:
  push:
    branches: [main]
    paths:
      - 'admin-progress.js'
      - 'admin-progress.css'
      - 'admin-dashboard.js'
      - 'admin-dashboard.css'
      - 'app.js'
      - 'integration.js'
      - 'cloudflare-integration.js'
      - 'index.html'
      - 'original/assets/hoerverstehen*.js'
      - 'original/hoerverstehen-data/*.json'
      - 'original/assets/lernhelfer.js'
      - 'assets/lernhelfer.js'
      - 'tests/admin-progress.test.cjs'
      - '.github/workflows/verify-lernsafari-main.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check integration.js
          node --check cloudflare-integration.js
          node --check admin-dashboard.js
          node --check admin-progress.js
          node --check original/assets/zahl-des-tages.js
          node --check original/assets/hoerverstehen.js
          node --check original/assets/hoerverstehen-kurz.js
          node --check original/assets/lernhelfer.js
      - name: Check learning statistics and source files
        run: |
          node --test tests/admin-progress.test.cjs
          node --test tests/cloudflare-communications.test.mjs
          node --test tests/cloudflare-projects.test.mjs
          node --test tests/cloudflare-classroom-service.test.mjs
          node --test tests/classroom-trusted-completion.test.mjs
          node - <<'NODE'
          const fs=require('node:fs');
          for(const name of ['admin-progress.css','admin-progress.js','topic-navigation.js','safari-area-theme.css',
            'assets/karte.png','assets/baobab.jpg','original/assets/hornvogel-zahl-des-tages.webp']){
            if(!fs.existsSync(name))throw Error('Missing: '+name);
          }
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('admin-progress.js'))throw Error('New report is not loaded');
          const source=fs.readFileSync('app.js','utf8');
          if(!source.includes("this.src='assets/karte.png'"))throw Error('Real map fallback missing');
          const baobab=fs.readFileSync('integration.js','utf8');
          if(!baobab.includes("this.src='assets/baobab.jpg'"))throw Error('Real Baobab fallback missing');
          const cf=fs.readFileSync('cloudflare-integration.js','utf8');
          if(!cf.includes('agendaDisplayText'))throw Error('Calendar prefixes missing');
          const admin=fs.readFileSync('admin-dashboard.js','utf8');
          if(!admin.includes('LernSafariProgress.render'))throw Error('Detailed learning stats not wired');
          if(!admin.includes('admin-activity-assignments'))throw Error('Assignment completion overview missing');
          console.log('PASS: LernSafari main code and asset fallback references');
          NODE

      - name: Verify short and woodland hearing comprehension scoring
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const ids=['affe','loewe','brille','wettrennen','kuchen'];
          for(const id of ids){
            const data=JSON.parse(fs.readFileSync('original/hoerverstehen-data/kurz-'+id+'.json'));
            if([data.task1.length,data.task2.length,data.task3.length,data.task4.length].join(',')!=='8,5,3,4')throw Error(id+': incomplete tasks');
            for(const q of [...data.task2,...data.task3]){
              if(q.options?.length!==4||!Number.isInteger(q.correct_index)||q.correct_index<0||q.correct_index>3)throw Error(id+': bad choices '+q.id);
              if(new Set(q.options).size!==4)throw Error(id+': repeated choices '+q.id);
            }
            if(id==='loewe'&&data.title!=='Der kleine Löwe')throw Error('Lion title mismatch');
          }
          for(const id of ['dachs','eichhoernchen','igel','reh','rotfuchs']){
            const data=JSON.parse(fs.readFileSync('original/hoerverstehen-data/'+id+'.json'));
            const total=data.tf.length+data.pick.length;
            if(total<5)throw Error(id+': invalid total');
            console.log('PASS woodland '+id+': '+total+' compulsory points; spelling exercise optional');
          }
          const short=fs.readFileSync('original/assets/hoerverstehen-kurz.js','utf8');
          const woods=fs.readFileSync('original/assets/hoerverstehen.js','utf8');
          if(!short.includes('q.correct_index')||short.includes('semantic(value'))throw Error('Short answers are not all single-choice');
          if(woods.includes("section('1. Ergänze den Lückentext'")||!woods.includes('Zusatzaufgabe – freiwillig'))throw Error('Woodland layout not updated');
          console.log('PASS five hearing stories with 20 points and four-choice answers');
          NODE

      - name: Audit expert help coverage in other scored games
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          let eligible=0,covered=0;const missing=[];
          for(const name of fs.readdirSync('original/spiele').filter(x=>x.endsWith('.html'))){
            const html=fs.readFileSync('original/spiele/'+name,'utf8');
            const tracked=/game-telemetry|highscore|game-attempt|scoreCount|correctCount/.test(html);
            if(!tracked)continue;
            eligible++;
            if(html.includes('lernhelfer.js'))covered++;else missing.push(name);
          }
          console.log('Tracked scored game pages: '+eligible+', with learner helper: '+covered);
          console.log('Missing helper:',missing.join(', ')||'none');
          NODE
