<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeichenschule · LernSafari Oase</title><link rel="stylesheet" href="../assets/oase-spiele.css"></head><body><main class="o-wrap"><header class="o-header"><small>🎨 OASE · KREATIVITÄT</small><h1>Zeichenschule</h1><p>Zeichne eine Vorlage nach. Du kannst die Hilfslinien ein- und ausblenden und dein Werk anschliessend speichern.</p></header><section class="o-panel"><div class="o-tools"><label>Vorlage <select id="motif"><option value="sonne">Sonne über der Savanne</option><option value="baum">Baobab-Baum</option><option value="vogel">Vogel</option><option value="haus">Safari-Hütte</option></select></label><button id="guide" class="o-button">Hilfslinien verstecken</button><div class="o-palette" id="palette"></div><label>Stift <select id="brush"><option value="3">Dünn</option><option value="8" selected>Mittel</option><option value="18">Dick</option></select></label><label>Werkzeug <select id="tool"><option value="pen">Stift</option><option value="erase">Radiergummi</option></select></label></div><div style="position:relative;width:100%;max-width:920px"><canvas id="canvas" class="o-canvas" width="960" height="600" aria-label="Zeichenfläche mit Vorlage"></canvas><svg id="guideOverlay" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" style="pointer-events:none;position:absolute;inset:0;width:100%;height:100%;opacity:.27" aria-hidden="true"></svg></div><div class="o-tools"><button id="undo" class="o-button">↶ Rückgängig</button><button id="clear" class="o-button">Neu zeichnen</button><button id="save" class="o-button primary">Bild speichern</button></div><p class="o-note">Tipp: Versuche zuerst grosse Formen, dann kleinere Details. Für deine eigene Zeichnung kannst du die Hilfslinien ausblenden.</p></section></main><script>window.OASE_ART_MODE='vorlage'</script><script src="../assets/oase-kunst.js" defer></script></body></html>
