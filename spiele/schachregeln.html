<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8efdf">
<title>Schachregeln – Lernsafari</title>
<link rel="stylesheet" href="../assets/game-theme.css">
<link rel="stylesheet" href="../assets/highscore.css">
<script defer src="../assets/analytics-config.js"></script>
<style>
:root{--pink:#d85c8f;--green:#5a7a43;--sand:#faf2df;--brown:#73533a;--line:#e1d5bd;--board-light:#f4e7c6;--board-dark:#c49d68;--good:#397f4d;--bad:#ae4343}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#fbf6eb,#f4ecd9);color:#2f2b26}.shell{max-width:1220px;margin:0 auto;padding:16px 18px 28px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.head h1{margin:0;font-size:clamp(29px,3vw,42px);color:#4b6137}.head p{margin:8px 0 0;color:#6b583f;font-size:18px}.top-tools{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800}.btn{border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.btn-secondary{background:#fff;border:1px solid #daccb4;color:#58472f}.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-top:18px}.rules-nav,.rule-panel{background:rgba(255,255,255,.93);border:1px solid #eadfc8;border-radius:24px;box-shadow:0 12px 36px rgba(90,76,34,.08)}.rules-nav{padding:16px}.rules-nav h2,.rule-panel h2{margin:0 0 12px;color:#596d3e}.rule-grid{display:grid;gap:10px}.rule-btn{display:flex;gap:10px;align-items:center;border:2px solid #eadfc8;background:#fff;border-radius:17px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit}.rule-btn.active{border-color:#d85c8f;background:#fff0f6}.rule-badge{width:38px;height:38px;border-radius:12px;background:#f7f1df;display:grid;place-items:center;font-size:23px}.rule-title{font-weight:800}.rule-sub{font-size:13px;color:#7b6a56}.rule-panel{padding:18px}.rule-top{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}.rule-info{background:#fff9ed;border:1px solid #ebdfc4;border-radius:18px;padding:14px 16px}.rule-info h3{margin:0 0 8px;font-size:27px;color:#5e6f41}.rule-info p{margin:0 0 10px;color:#675039;line-height:1.45}.hint{display:inline-block;background:#eaf4e7;padding:7px 11px;border-radius:999px;font-weight:800;color:#3b6642}.board{width:min(100%,300px);display:grid;grid-template-columns:repeat(8,1fr);border:6px solid #a97d49;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(56,45,25,.2)}.sq{aspect-ratio:1/1;border:0;padding:0;display:grid;place-items:center;position:relative;font-size:29px;font-weight:800}.light{background:var(--board-light)}.dark{background:var(--board-dark)}.coord::after{content:attr(data-coord);position:absolute;right:4px;bottom:3px;font-size:10px;color:rgba(30,22,14,.55)}.selected{outline:4px solid #ff7ab4;outline-offset:-4px}.target::before{content:"";width:18px;height:18px;border-radius:50%;background:rgba(61,139,87,.8);position:absolute}.capture::before{content:"";position:absolute;inset:7px;border-radius:50%;border:4px solid rgba(174,67,67,.9)}.kingcheck{background:#ffc7c7!important}.task{margin-top:16px;border-top:1px solid #ebdfc4;padding-top:14px}.task p{margin:0 0 10px;color:#664f37}.options{display:flex;gap:10px;flex-wrap:wrap}.opt{border:2px solid #e5d8c3;background:#fff;border-radius:14px;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer}.opt.selected{border-color:#d85c8f;background:#fff0f6}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.btn-primary{background:#5a7a43;color:#fff}.feedback{min-height:28px;margin-top:10px;font-weight:800}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.complete{margin-top:16px;background:#fff;border:2px solid #cfe0c8;border-radius:20px;padding:18px;text-align:center}.complete h2{margin:0;color:#46754d;font-size:34px}.hidden{display:none!important}@media(max-width:980px){.layout{grid-template-columns:1fr}.rule-top{grid-template-columns:1fr}}@media(max-width:640px){.shell{padding:14px 10px 24px}.board{width:100%}.sq{font-size:24px}}
</style>
</head>
<body>
<div class="safari-exit-bar"><span>Lernsafari</span><a href="../index.html#aktuelle">✕ Spiel beenden</a></div>
<main class="shell">
  <section class="head">
    <div><h1>Schachregeln</h1><p>Entdecke die wichtigsten Regeln mit kleinen Bildaufgaben und Minibrettern.</p></div>
    <div class="top-tools"><div class="pill" id="progress">Richtig: 0</div><div class="pill" id="task-pill">Regel 1 von 7</div><button type="button" class="btn btn-secondary" id="restart-all">Neu starten</button></div>
  </section>

  <section class="layout">
    <aside class="rules-nav"><h2>Regeln</h2><div class="rule-grid" id="rule-grid"></div></aside>
    <section class="rule-panel">
      <div class="rule-top">
        <div><div class="board" id="rule-board"></div></div>
        <div class="rule-info"><h3 id="rule-title"></h3><p id="rule-text"></p><div class="hint" id="rule-hint"></div></div>
      </div>
      <div class="task">
        <p id="task-text"></p>
        <div id="options-box" class="options"></div>
        <div class="controls"><button class="btn btn-primary" id="check-btn" type="button">Prüfen</button><button class="btn btn-secondary" id="next-btn" type="button" disabled>Nächste Regel</button></div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
        <div id="extra-info"></div>
      </div>
      <div class="complete hidden" id="complete-box"><h2>Regeln verstanden! ♚</h2><p>Du hast alle sieben Schachregeln durchgespielt.</p><p><button class="btn btn-primary" id="again-btn" type="button">Noch einmal spielen</button></p></div>
    </section>
  </section>
</main>
<script src="../assets/chess-common.js"></script>
<script>
'use strict';
const C=window.ChessSafari;
const RULES=[
 {id:'goal',icon:'🎯',title:'Ziel',sub:'Den König mattsetzen',text:'Beim Schach möchtest du den gegnerischen König so angreifen, dass er nicht mehr entkommen kann. Das heisst Schachmatt.',hint:'Schachmatt beendet die Partie.',kind:'choice',options:['Alle Bauern schlagen','Den gegnerischen König schachmatt setzen','Alle Figuren vom Brett nehmen'],correct:1},
 {id:'start',icon:'⚪',title:'Wer beginnt?',sub:'Weiss startet',text:'In jeder Schachpartie beginnt Weiss. Danach ziehen die Spielenden immer abwechselnd.',hint:'Die helle Seite macht den ersten Zug.',kind:'choice',options:['Schwarz beginnt','Weiss beginnt','Die Dame beginnt'],correct:1},
 {id:'capture',icon:'✂️',title:'Schlagen',sub:'Figuren schlagen',text:'Figuren dürfen gegnerische Figuren schlagen, wenn das Zielfeld nach ihren Zugregeln erreichbar ist.',hint:'Klicke den weissen Turm und dann ein Feld, auf dem er eine schwarze Figur schlagen darf.',kind:'move',state:()=>C.fromFEN('4k3/8/8/3p4/3R3r/8/8/4K3 w - - 0 1'),expectedMoves:(state)=>C.legalMoves(state).filter(m=>m.from===C.parseSquare('d4')&&!!m.capture),pieceSquare:'d4'},
 {id:'check',icon:'⚠️',title:'Schach',sub:'König ist bedroht',text:'Steht dein König im Schach, musst du sofort reagieren: den König bewegen, die angreifende Figur schlagen oder das Schach abdecken.',hint:'Ziehe den weissen König auf ein sicheres Feld.',kind:'move',state:()=>C.fromFEN('4k3/8/8/8/8/8/4r3/4K3 w - - 0 1'),expectedMoves:(state)=>C.legalMoves(state),pieceSquare:'e1'},
 {id:'mate',icon:'👑',title:'Schachmatt',sub:'Kein Weg mehr frei',text:'Bei Schachmatt ist der König bedroht und es gibt keinen legalen Zug mehr. Dann ist die Partie fertig.',hint:'Ist die gezeigte Stellung nur Schach oder schon Schachmatt?',kind:'choiceBoard',state:()=>C.fromFEN('7k/6Q1/6K1/8/8/8/8/8 b - - 0 1'),options:['Schach','Schachmatt'],correct:1},
 {id:'castle',icon:'🏰',title:'Rochade',sub:'König und Turm zusammen',text:'Bei der Rochade bewegt sich der König zwei Felder zum Turm. Der Turm springt dann direkt neben den König. Das geht nur, wenn noch nicht gezogen wurde und nichts im Weg ist.',hint:'Führe die kurze Rochade mit Weiss aus.',kind:'move',state:()=>C.fromFEN('4k3/8/8/8/8/8/8/4K2R w K - 0 1'),expectedMoves:(state)=>C.legalMoves(state).filter(m=>m.castle==='K'),pieceSquare:'e1'},
 {id:'enpassant',icon:'🧩',title:'En Passant',sub:'Schlagen im Vorbeigehen',text:'Zieht ein Bauer zwei Felder vor und landet neben deinem Bauern, darfst du ihn sofort im Vorbeigehen schlagen.',hint:'Ziehe den weissen Bauern so, dass er den schwarzen Bauern en passant schlägt.',kind:'move',state:()=>C.fromFEN('4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 1'),expectedMoves:(state)=>C.legalMoves(state).filter(m=>m.enPassant),pieceSquare:'e5'}
];
let index=0,score=0,selectedOption=null,selectedPiece=null,currentState=null,expectedMoves=[],checked=false;
function renderNav(){const host=document.getElementById('rule-grid');host.innerHTML=RULES.map((r,i)=>`<button type="button" class="rule-btn ${i===index?'active':''}"><span class="rule-badge">${r.icon}</span><span><span class="rule-title">${r.title}</span><br><span class="rule-sub">${r.sub}</span></span></button>`).join('');}
function renderBoard(){const host=document.getElementById('rule-board');host.innerHTML=''; const selectedSq=selectedPiece; const legal = selectedSq!==null?C.legalMoves(currentState).filter(m=>m.from===selectedSq):[]; const inCheckSq=C.inCheck(currentState,currentState.turn)?currentState.board.findIndex(p=>p=== (currentState.turn==='w'?'K':'k')):-1; for(let r=0;r<8;r++)for(let f=0;f<8;f++){const sq=C.idx(f,r);const piece=currentState.board[sq]||'';const btn=document.createElement('button');btn.type='button';btn.className=`sq coord ${(r+f)%2?'dark':'light'}`;btn.dataset.coord=C.algebraic(sq);btn.dataset.sq=String(sq);btn.textContent=piece?C.unicode[piece]:''; if(sq===selectedSq)btn.classList.add('selected'); if(sq===inCheckSq)btn.classList.add('kingcheck'); if(legal.some(m=>m.to===sq)){btn.classList.add(legal.some(m=>m.to===sq&&m.capture)?'capture':'target');}
 btn.addEventListener('click',()=>onBoardClick(sq)); host.append(btn);} }
function onBoardClick(sq){const rule=RULES[index]; if(rule.kind!=='move' || checked)return; const piece=currentState.board[sq]; if(piece && C.colorOf(piece)===currentState.turn){selectedPiece=sq; renderBoard(); return;} if(selectedPiece===null)return; const move=C.legalMoves(currentState).find(m=>m.from===selectedPiece&&m.to===sq); if(!move)return; currentState=C.apply(currentState,move); const ok=expectedMoves.some(m=>C.equalMove(m,move)); checked=true; const fb=document.getElementById('feedback'); if(ok){score++; fb.textContent='Richtig! Genau so geht diese Regel.'; fb.className='feedback good';} else {fb.textContent='Dieser Zug ist legal, aber hier war eine andere Regel-Lösung gesucht.'; fb.className='feedback bad';}
 document.getElementById('next-btn').disabled=false; document.getElementById('extra-info').innerHTML=`<p><strong>Dein Zug:</strong> ${C.moveText(move)}</p><p><strong>Mögliche Lösung:</strong> ${expectedMoves.map(C.moveText).join(' oder ')}</p>`; window.SafariTelemetry?.record({task:`Schachregeln ${rule.title}`,correct:ok,correctCount:ok?1:0,total:1,answer:C.moveText(move),expected:expectedMoves.map(C.moveText).join(' / '),details:rule.title}); renderBoard(); updatePills();}
function renderRule(){if(index>=RULES.length){document.getElementById('complete-box').classList.remove('hidden');document.querySelector('.task').classList.add('hidden');renderNav();updatePills();return;} const rule=RULES[index]; renderNav(); selectedOption=null; selectedPiece=null; checked=false; currentState=rule.state?rule.state():C.fromFEN('8/8/8/8/8/8/8/8 w - - 0 1'); expectedMoves=rule.expectedMoves?rule.expectedMoves(currentState):[]; document.getElementById('rule-title').textContent=`${rule.icon} ${rule.title}`; document.getElementById('rule-text').textContent=rule.text; document.getElementById('rule-hint').textContent=rule.hint; document.getElementById('task-text').textContent=rule.kind==='choice'?'Wähle die richtige Antwort.':rule.kind==='choiceBoard'?'Schau das Brett an und wähle die richtige Aussage.':'Tippe auf die richtige Figur. Ihre möglichen legalen Züge werden markiert. Führe dann den passenden Zug aus.'; document.getElementById('feedback').textContent=''; document.getElementById('feedback').className='feedback'; document.getElementById('extra-info').innerHTML=''; document.getElementById('next-btn').disabled=true; const box=document.getElementById('options-box'); box.innerHTML=''; if(rule.kind==='choice'||rule.kind==='choiceBoard'){rule.options.forEach((opt,i)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=opt;b.addEventListener('click',()=>{if(checked)return; selectedOption=i; [...box.children].forEach(x=>x.classList.remove('selected')); b.classList.add('selected');}); box.append(b);});} renderBoard(); updatePills();}
function updatePills(){document.getElementById('progress').textContent=`Richtig: ${score}`; document.getElementById('task-pill').textContent=`Regel ${Math.min(index+1,RULES.length)} von ${RULES.length}`;}
function checkRule(){if(index>=RULES.length||checked)return; const rule=RULES[index]; if(rule.kind==='move'){document.getElementById('feedback').textContent='Führe zuerst den Zug direkt auf dem Brett aus.'; document.getElementById('feedback').className='feedback'; return;} if(selectedOption===null){document.getElementById('feedback').textContent='Wähle zuerst eine Antwort aus.'; return;} checked=true; const ok=selectedOption===rule.correct; if(ok)score++; const fb=document.getElementById('feedback'); fb.textContent=ok?'Richtig! Super!':'Das stimmt noch nicht ganz.'; fb.className='feedback '+(ok?'good':'bad'); document.getElementById('next-btn').disabled=false; window.SafariTelemetry?.record({task:`Schachregeln ${rule.title}`,correct:ok,correctCount:ok?1:0,total:1,answer:rule.options[selectedOption],expected:rule.options[rule.correct],details:rule.title}); updatePills();}
function nextRule(){index++; renderRule();}
function restart(){index=0;score=0;document.getElementById('complete-box').classList.add('hidden');document.querySelector('.task').classList.remove('hidden');renderRule();}

document.getElementById('check-btn').addEventListener('click',checkRule);
document.getElementById('next-btn').addEventListener('click',nextRule);
document.getElementById('restart-all').addEventListener('click',restart);
document.getElementById('again-btn').addEventListener('click',restart);
restart();
</script>
<script src="../assets/login-config.js"></script>
<script defer src="../assets/highscore.js"></script>
<script defer src="../assets/game-telemetry.js"></script>
</body>
</html>
